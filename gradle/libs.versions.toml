[versions]
agp = "9.4.1"
kotlin = "2.4.20"
# The Kalapa Ads SDK version this sample is built against; override with -PkalapaAdsVersion=<version>.
kalapaAds = "0.1.0"
composeBom = "2026.06.01"
activity = "1.13.0"
lifecycle = "2.10.0"
junit = "4.13.2"

[libraries]
kalapa-ads-bom = { module = "vn.kalapa:ads-bom", version.ref = "kalapaAds" }
kalapa-ads-ui-view = { module = "vn.kalapa:ads-ui-view" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
